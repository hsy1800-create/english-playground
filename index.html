var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {

if(state.step>=state.total){finish();return}const q=state.q,ppt=role==='ppt',teacher=role==='teacher';app.innerHTML='<section class="slide"><div class="headrow"><span class="tag">'+(ppt?'PPT 모드':teacher?'QR 참여 모드 · 교사':'학생 참여')+' · '+q.type+' · '+(state.step+1)+' / '+state.total+'</span><div class="actions compact">'+(teacher?'<button class="secondary" onclick="showQR()">▦ 참여 QR · '+session.code+'</button>':'')+'<button class="secondary" onclick="fullscreen()">⛶ 전체 화면</button><button class="secondary" onclick="if(confirm(\'첫 화면으로 돌아갈까요?\'))leave()">나가기</button></div></div><div class="progress"><i style="width:'+((state.step+1)/state.total*100)+'%"></i></div><h2 class="question">'+esc(q.prompt)+'</h2><div id="visual">'+(q.place?scene(q.place):'<div class="emoji">'+(q.emoji||'🔊')+'</div>')+'</div><div class="headrow"><span id="memoryLabel" class="muted">'+(q.memory?'그림을 기억해요. 5초 뒤 가려집니다.':ppt?'친구들과 이야기하고 답을 정해요.':'')+'</span><button class="secondary" onclick="speak()">🔊 듣기</button></div>'+questionControls(q,ppt,teacher)+'<p id="status" class="status" role="status">'+(state.mine?'제출 완료! 선생님의 정답 공개를 기다려요.':teacher?'학생들과 문장을 말해 본 뒤 정답을 공개해 주세요.':'')+'</p>'+(state.revealed?'<div class="result" role="status"><small>정답</small><strong>'+esc(state.answer)+'</strong>'+(role==='student'?'<span>'+(state.mine===state.answer?'잘했어요!':'정답을 확인하고 다시 말해요.')+'</span>':'')+'</div>':'')+'<nav class="slide-nav">'+(ppt?'<button class="secondary" onclick="pptPrev()" '+(pptIndex===0?'disabled':'')+'>← 이전</button><button class="yellow" onclick="pptReveal()" '+(state.revealed?'disabled':'')+'>정답 공개 · Space</button><button onclick="pptNext()" '+(!state.revealed?'disabled':'')+'>'+(state.step===state.total-1?'결과 보기':'다음 →')+'</button>':teacher?'<span id="count">'+state.answered+' / '+state.players.length+'명 제출</span>'+(!state.revealed?'<button class="yellow" onclick="control(\'reveal\')">정답 공개</button>':'<button onclick="control(\'next\')">'+(state.step===state.total-1?'결과 보기':'다음 →')+'</button>'):'')+'</nav>'+(ppt?scoreboard():'')+'</section>';armMemory()}
function questionControls(q,ppt,teacher){const disabled=teacher||state.mine||state.revealed;if(q.words)return '<div class="wordline" id="wordline">'+esc(state.mine||selected.map(i=>q.words[i]).join(q.join??' '))+'</div><div class="words">'+q.words.map((w,i)=>'<button class="secondary" id="word'+i+'" onclick="addWord('+i+')" '+(disabled?'disabled':'')+'>'+esc(w)+'</button>').join('')+'</div>'+(!teacher?'<div class="actions compact"><button class="secondary" onclick="resetWords()" '+(state.mine||state.revealed?'disabled':'')+'>다시 배열</button>'+(ppt?'':'<button onclick="submitWords()" '+(disabled?'disabled':'')+'>답 제출</button>')+'</div>':'');return '<div class="choices">'+q.options.map((o,i)=>'<button class="'+(state.mine===o?'selected ':'')+(state.revealed&&state.answer===o?'correct':'')+'" onclick="choose('+i+')" '+(disabled?'disabled':'')+'><span class="option-letter">'+String.fromCharCode(65+i)+'</span>'+esc(o)+'</button>').join('')+'</div>'}
function addWord(i){if(selected.includes(i)||state.revealed||state.mine)return;selected.push(i);document.getElementById('word'+i).disabled=true;document.getElementById('wordline').textContent=selected.map(i=>state.q.words[i]).join(state.q.join??' ')}
function resetWords(){selected=[];document.getElementById('wordline').textContent='';state.q.words.forEach((_,i)=>document.getElementById('word'+i).disabled=false)}
function submitWords(){if(selected.length!==state.q.words.length){showError(Error('단어를 모두 배열한 뒤 제출해 주세요.'));return}submit(selected.map(i=>state.q.words[i]).join(state.q.join??' '))}
function choose(i){const value=state.q.options[i];if(role==='ppt'){state.mine=value;document.querySelectorAll('.choices button').forEach((b,j)=>b.classList.toggle('selected',j===i));return}submit(value)}
async function submit(value){if(busy||state.mine||state.revealed)return;busy=true;const step=state.step;try{await api('answer',{value});if(step===state.step){state.mine=value;draw()}}catch(e){showError(e)}finally{busy=false}}
function armMemory(){if(!state.q?.memory||state.revealed)return;const k=role+':'+session.code+':'+state.step;if(!seen.has(k))seen.set(k,Date.now());const ms=5000-(Date.now()-seen.get(k));const hide=()=>{const v=document.getElementById('visual');if(v)v.innerHTML='<div class="memory-cover">? <span>모자는 어디에 있었나요?</span></div>';const t=document.getElementById('memoryLabel');if(t)t.textContent='기억한 위치로 답해요.'};if(ms<=0)hide();else memoryTimer=setTimeout(hide,ms)}
function speak(){if(!state.q)return;const q=role==='ppt'?state.q:bank.find(x=>x.type===state.q.type&&x.prompt===state.q.prompt&&x.place===state.q.place)||state.q;const text=q.say||q.prompt;if(!('speechSynthesis'in window)){showError(Error('이 브라우저는 음성 듣기를 지원하지 않아요. 선생님이 읽어 주세요.'));return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}
function finish(){clearInterval(pollTimer);app.innerHTML='<section class="center panel finish"><div class="emoji">🎉</div><span class="tag">GAME COMPLETE</span><h1 style="font-size:44px">오늘 게임 완료!</h1>'+(role==='ppt'?scoreboard():role==='teacher'?'<div class="players">'+state.players.map(p=>'<span>'+esc(p.name)+' · '+p.score+' / '+state.total+'</span>').join('')+'</div>':'<p>오늘 배운 표현을 친구에게 한 번 더 말해요.</p>')+'<div class="result"><strong>Where’s my cap?</strong><span>It’s on the table.</span></div><div class="actions"><button onclick="leave()">다른 게임 고르기</button>'+(role==='ppt'?'<button class="secondary" onclick="pptIndex=0;scores.fill(0);seen.clear();loadPPT()">한 번 더 하기</button>':'')+'</div></section>'}
function fullscreen(){if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});else document.documentElement.requestFullscreen?.().catch(()=>showError(Error('브라우저의 전체 화면 기능을 사용해 주세요.')))}
document.addEventListener('keydown',e=>{if(role!=='ppt'||!state.q||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||document.getElementById('qrDialog').open)return;if(e.key===' '||e.key==='ArrowRight'){e.preventDefault();pptNext()}else if(e.key==='ArrowLeft'){e.preventDefault();pptPrev()}else if(e.key.toLowerCase()==='f')fullscreen()});
if(new URLSearchParams(location.search).has('room'))joinView();else home();
</script></body></html>
